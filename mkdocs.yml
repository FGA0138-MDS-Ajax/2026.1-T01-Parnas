site_name: Grupo Parnas
site_url:  https://fga0138-mds-ajax.github.io/2026.1-T01-Parnas/
repo_url: https://github.com/FGA0138-MDS-Ajax/2026.1-T01-Parnas
repo_name: 2026.1-T01-Parnas
plugins:
  - search

theme:
  name: material
  custom_dir: overrides
  language: pt-BR
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - navigation.footer

  logo: assets/images/favicon.png
  icon:
    top: material/arrow-up-thin
    previous: material/arrow-left
    next: material/arrow-right
    repo: material/github

  font:
    text: Playfair Display
    code: Lora

  palette:
    #Paleta para modo automático
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/set-right
        name: Alternar para Modo Claro

    #Paleta para modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/set-all
        name: Alternar para Modo Escuro

    #Paleta para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/set-none
        name: Alternar para Preferência do Sistema

nav:
