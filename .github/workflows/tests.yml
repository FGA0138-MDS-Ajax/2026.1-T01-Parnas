name: tests
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: pytest + coverage
        run: |
          pytest \
            --cov=app --cov-report=term-missing --cov-report=xml \
            --junitxml=test-results.xml | tee test-output.txt
      - name: Publicar dados do backend (coverage + resultados)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-backend
          path: |
            backend/test-output.txt
            backend/coverage.xml
            backend/test-results.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: vitest + coverage
        run: npm run test:coverage | tee test-output.txt
      - name: Publicar dados do frontend (coverage + resultados)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-frontend
          path: |
            frontend/test-output.txt
            frontend/coverage/
